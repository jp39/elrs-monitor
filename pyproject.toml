[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elrs-monitor"
version = "0.9.1"
description = "Receive-only HackRF ExpressLRS live/replay decoder with a channel-state TUI"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
elrs-monitor = "elrs_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
